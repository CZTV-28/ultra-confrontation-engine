[package]
name = "ultra-confrontation-engine"
version = "0.1.0"
description = "Ultra Confrontation Engine"
authors = ["you"]
edition = "2021"

[lib]
name = "ultra_confrontation_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
lazy_static = "1.4"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
